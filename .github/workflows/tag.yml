# Manual release marker: Actions → Tag release → Run workflow (patch by default; pick minor/major from the dropdown).
# Bumps the latest tag on main. install.sh shows the latest tag in the app.
name: Tag release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the latest tag to bump
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<<"${latest:-v0.0.0}"
          major=${major#v}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          next="v$major.$minor.$patch"
          echo "$latest -> $next"
          git tag "$next" && git push origin "$next"
        env:
          BUMP: ${{ github.event.inputs.bump }}
